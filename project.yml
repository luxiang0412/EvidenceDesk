name: EvidenceDesk
options:
  bundleIdPrefix: com.luxiang0412
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
targets:
  EvidenceDesk:
    type: application
    platform: macOS
    sources:
      - path: EvidenceDesk
    info:
      path: EvidenceDesk/Info.plist
      properties:
        CFBundleName: Evidence Desk
        CFBundleDisplayName: Evidence Desk
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Copyright © 2026."
        CFBundleIconName: AppIcon
        CFBundleLocalizations:
          - en
          - zh-Hans
        CFBundleDevelopmentRegion: en
    entitlements:
      path: EvidenceDesk/EvidenceDesk.entitlements
      properties:
        # App Sandbox is required from the first build, not deferred to release.
        # Only user-selected file access is requested: the app never fetches the
        # network and copies chosen files into its own container.
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luxiang0412.EvidenceDesk
        PRODUCT_NAME: EvidenceDesk
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: 
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    scheme:
      testTargets:
        - EvidenceDeskTests
        - EvidenceDeskUITests
  EvidenceDeskTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: EvidenceDeskTests
    dependencies:
      - target: EvidenceDesk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luxiang0412.EvidenceDeskTests
        GENERATE_INFOPLIST_FILE: YES
  EvidenceDeskUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: EvidenceDeskUITests
    dependencies:
      - target: EvidenceDesk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luxiang0412.EvidenceDeskUITests
        GENERATE_INFOPLIST_FILE: YES