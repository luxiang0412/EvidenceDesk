name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned runner image — do NOT rely on macos-latest, whose Xcode changes.
  # Must provide Xcode 27.1 / Swift 6.4. Update both together.
  REQUIRED_XCODE_VERSION: "27.1"
  XCODEGEN_VERSION: "2.46.0"

jobs:
  verify:
    name: Build & test (macOS)
    runs-on: macos-27
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode toolchain matches the recorded baseline
        run: |
          set -euo pipefail
          actual="$(xcodebuild -version | awk '/Xcode/{print $2}')"
          echo "Required Xcode: $REQUIRED_XCODE_VERSION"
          echo "Runner Xcode:   $actual"
          if [ "$actual" != "$REQUIRED_XCODE_VERSION" ]; then
            echo "::error::Runner Xcode $actual does not match the recorded stable baseline $REQUIRED_XCODE_VERSION."
            echo "Select the matching Xcode or update REQUIRED_XCODE_VERSION with a recorded decision."
            /usr/bin/xcodebuild -showsdks || true
            exit 1
          fi
          swift --version

      - name: Install pinned XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          installed="$(xcodegen --version | awk '{print $2}')"
          echo "Installed XcodeGen: $installed (expected $XCODEGEN_VERSION)"
          if [ "$installed" != "$XCODEGEN_VERSION" ]; then
            echo "::warning::XcodeGen version differs from the recorded version; project.yml is resolved by XcodeGen, so review any generated changes."
          fi

      - name: Generate project
        run: ./scripts/generate-project.sh

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project EvidenceDesk.xcodeproj \
            -scheme EvidenceDesk \
            -destination 'platform=macOS' \
            -derivedDataPath artifacts/DerivedData \
            -configuration Debug \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Unit and integration tests
        run: |
          set -o pipefail
          mkdir -p artifacts/TestResults
          xcodebuild test \
            -project EvidenceDesk.xcodeproj \
            -scheme EvidenceDesk \
            -destination 'platform=macOS' \
            -derivedDataPath artifacts/DerivedData \
            -only-testing:EvidenceDeskTests \
            -resultBundlePath artifacts/TestResults/ci-tests.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      # UI automation needs the runner to be authorised for Accessibility.
      # On GitHub-hosted runners this frequently times out, so it is opt-in via
      # a repository variable rather than silently skipped.
      - name: UI tests (optional, requires authorised automation)
        if: vars.RUN_UI_TESTS == 'true'
        run: |
          set -o pipefail
          xcodebuild test \
            -project EvidenceDesk.xcodeproj \
            -scheme EvidenceDesk \
            -destination 'platform=macOS' \
            -derivedDataPath artifacts/DerivedData \
            -only-testing:EvidenceDeskUITests \
            -resultBundlePath artifacts/TestResults/ci-uitests.xcresult

      - name: Environment record
        if: always()
        run: ./scripts/env.sh || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            artifacts/TestResults
            artifacts/P0/environment.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: artifacts/Screenshots
          if-no-files-found: ignore
          retention-days: 14

# Notes
# - No signing certificates, provisioning profiles or App Store Connect keys are
#   used here. CI builds an unsigned artefact for verification only.
# - No publishing step exists: releases are manual and explicitly authorised.
